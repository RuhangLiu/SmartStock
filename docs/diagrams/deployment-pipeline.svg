<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">SmartStock deployment pipeline</title>
  <desc id="desc">A feature branch is tested and reviewed through a pull request, merged to main, built by Azure Deployment Center, deployed to App Service, and verified with smoke tests.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#315a72"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#12304a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #102f4a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #637786; }
      .box { fill: #fff; stroke: #9eb4bf; stroke-width: 2; filter: url(#shadow); }
      .review { fill: #fff3e7; stroke: #c86445; stroke-width: 2; filter: url(#shadow); }
      .done { fill: #ebf5ef; stroke: #4c8b6f; stroke-width: 2; filter: url(#shadow); }
      .num { font: 700 18px Arial, sans-serif; fill: #c86445; }
      .label { font: 700 20px Arial, sans-serif; fill: #102f4a; }
      .small { font: 400 15px Arial, sans-serif; fill: #5e7280; }
      .flow { stroke: #315a72; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="500" fill="#fbfaf7"/>
  <text x="65" y="65" class="title">SmartStock Deployment and Validation Pipeline</text>
  <text x="65" y="98" class="subtitle">Controlled release path from source change to verified Azure production</text>

  <g transform="translate(65 165)">
    <rect width="190" height="155" rx="18" class="box"/>
    <text x="25" y="35" class="num">01</text><text x="95" y="72" class="label" text-anchor="middle">Feature Branch</text>
    <text x="95" y="106" class="small" text-anchor="middle">Scoped change</text><text x="95" y="132" class="small" text-anchor="middle">and documentation</text>
  </g>
  <g transform="translate(300 165)">
    <rect width="190" height="155" rx="18" class="box"/>
    <text x="25" y="35" class="num">02</text><text x="95" y="72" class="label" text-anchor="middle">Automated Tests</text>
    <text x="95" y="106" class="small" text-anchor="middle">45 HTTP cases</text><text x="95" y="132" class="small" text-anchor="middle">isolated SQLite</text>
  </g>
  <g transform="translate(535 165)">
    <rect width="190" height="155" rx="18" class="review"/>
    <text x="25" y="35" class="num">03</text><text x="95" y="72" class="label" text-anchor="middle">Pull Request</text>
    <text x="95" y="106" class="small" text-anchor="middle">Review evidence</text><text x="95" y="132" class="small" text-anchor="middle">then merge to main</text>
  </g>
  <g transform="translate(770 165)">
    <rect width="190" height="155" rx="18" class="box"/>
    <text x="25" y="35" class="num">04</text><text x="95" y="72" class="label" text-anchor="middle">Azure Build</text>
    <text x="95" y="106" class="small" text-anchor="middle">npm ci + Vite</text><text x="95" y="132" class="small" text-anchor="middle">Node.js 24</text>
  </g>
  <g transform="translate(1005 165)">
    <rect width="190" height="155" rx="18" class="box"/>
    <text x="25" y="35" class="num">05</text><text x="95" y="72" class="label" text-anchor="middle">App Service</text>
    <text x="95" y="106" class="small" text-anchor="middle">Deploy application</text><text x="95" y="132" class="small" text-anchor="middle">and persistent data</text>
  </g>
  <g transform="translate(1240 165)">
    <rect width="190" height="155" rx="18" class="done"/>
    <text x="25" y="35" class="num">06</text><text x="95" y="72" class="label" text-anchor="middle">Smoke Test</text>
    <text x="95" y="106" class="small" text-anchor="middle">Login, data, AI</text><text x="95" y="132" class="small" text-anchor="middle">and read-only checks</text>
  </g>

  <path d="M255 243 L300 243" class="flow"/><path d="M490 243 L535 243" class="flow"/>
  <path d="M725 243 L770 243" class="flow"/><path d="M960 243 L1005 243" class="flow"/>
  <path d="M1195 243 L1240 243" class="flow"/>
  <text x="65" y="405" class="small">Rollback: use Azure Deployment Center deployment history to redeploy the last known-good commit, then repeat smoke validation.</text>
</svg>
